name: Check

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main, "codex/**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
          package-manager-cache: false
      - run: python -m pip install -e ".[dev]"
      - run: npm --prefix apps/web ci
      - run: make check
      - name: Install Chromium for browser tests
        run: npm --prefix apps/web exec -- playwright install --with-deps --only-shell chromium
      - name: Test the offline career journey in Chromium
        run: npm --prefix apps/web run test:browser
        env:
          AVENIR_PYTHON: python

  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash scripts/smoke-production.sh
