services:
  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4175:4175"
    init: true
    restart: unless-stopped

  api:
    profiles: ["api-only"]
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./snapshots:/app/snapshots:ro
    # The demo needs no keys. Only uncomment for the optional live-ads path (never commit .env).
    # env_file:
    #   - .env
