# Every raw input Avenir uses. Raw files live in data/raw/ (gitignored).
# Run `make data-check` after downloading: it checks each `path` exists and records
# checksums in data/manifest.lock.json (commit the lock file, never the data).
#
# how: script = scripts/fetch/<script>; browser = manual download, then rsync to the cluster;
# manual = a table people copy by hand from public pages into a committed file (data/curated/)
# Fill `licence_checked_by` with your initials once you have read the licence on download.

sources:

  - id: esco
    name: ESCO v1.2 classification (occupations, skills, occupation-skill relations)
    how: browser
    url: https://esco.ec.europa.eu/en/use-esco/download   # (verify path) needs the download form
    instructions: >
      Choose version v1.2.x, language English, format CSV, type "classification".
      The link arrives by email. Unzip into data/raw/esco/.
    path: data/raw/esco/
    expect: [occupations_en.csv, skills_en.csv, occupationSkillRelations_en.csv]  # (verify names)
    coverage: EU, maps to ISCO-08
    licence: European Commission reuse policy, attribution  # (verify on download)
    licence_checked_by: ""
    used_by: [M1 matcher, M2 exposure tasks, M3 hedge]

  - id: ashe_t14
    name: ONS ASHE Table 14, earnings by occupation (4-digit SOC), 2011 to 2025
    how: script
    script: scripts/fetch/ons_ashe.py
    url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/datasets/occupation4digitsoc2010ashetable14
    instructions: >
      One ONS page holds every edition (the URL says soc2010 for all years). Use "revised"
      editions where they exist, "2025 provisional" for the latest. 2011 = "2011 revised,
      based on SOC 2010". Editions from 2021 are coded to SOC 2020 (verify inside the files).
      Check whether the 2026 provisional edition (due Oct 2026) is out.
    path: data/raw/ashe/
    coverage: UK
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [pay metrics, M5 backtest]

  - id: soc2010_soc2020
    name: ONS relationship tables SOC 2010 <-> SOC 2020 (July 2021)
    how: script
    script: scripts/fetch/ons_files.py
    files:
      - https://www.ons.gov.uk/file?uri=/methodology/classificationsandstandards/standardoccupationalclassificationsoc/soc2020/therelationshipbetweenstandardoccupationalclassification2010andstandardoccupationalclassification2020/soc2010soc2020relationshiptablesjuly2021.xlsx
      - https://www.ons.gov.uk/file?uri=/methodology/classificationsandstandards/standardoccupationalclassificationsoc/soc2020/therelationshipbetweenstandardoccupationalclassification2010andstandardoccupationalclassification2020/soc2020soc2010relationshiptablesjuly2021.xlsx
    instructions: >
      Percentages of dual-coded cases (LFS 2014-16, Census 2011 1% sample), a guide not an
      exact crosswalk. Split or merged codes get low confidence in the backtest.
    path: data/raw/crosswalks/
    coverage: UK
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [M5 backtest bridge, ISCO mapping]

  - id: soc2010_isco08
    name: ONS SOC 2010 to ISCO-08 mapping
    how: script
    script: scripts/fetch/ons_files.py
    files:
      - https://www.ons.gov.uk/file?uri=/methodology/classificationsandstandards/standardoccupationalclassificationsoc/soc2010/ug201002soc2010toisco08v2_tcm77-283163.xls
    instructions: >
      ONS publishes NO SOC 2020 to ISCO-08 file ("no simple mapping, even at unit group
      level"). Route: SOC 2020 -> SOC 2010 (relationship tables) -> ISCO-08, then a human
      approves each of our 20 occupations in data/curated/mappings.csv with verified_by.
    path: data/raw/crosswalks/
    coverage: UK
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [ILO exposure join, ESCO join]

  - id: aps_occupation
    name: APS employment by occupation (Nomis)
    how: script
    script: scripts/fetch/nomis_aps.py
    datasets:
      - id: NM_218_1   # Nomis APS218, SOC 2020, 4-digit, latest Apr 2025-Mar 2026
        years: 2021+
      - id: NM_168_1   # Nomis APS168, SOC 2010, 4-digit, to Dec 2021
        years: 2011-2021
    instructions: >
      No key needed for basic use. Run with --describe first to list dimension names, then
      fetch UK, all 4-digit codes, 12-month periods. 4-digit APS counts are small samples:
      carry n and widen intervals. For years before 2011, ONS EMP04 spreadsheets (2001-2018)
      are an alternative (verify their SOC level).
    path: data/raw/aps/
    coverage: UK
    licence: Open Government Licence v3.0 (Nomis terms, verify)
    licence_checked_by: ""
    used_by: [M4 demand trend, M5 backtest]

  - id: ilo_genai_2025
    name: ILO GenAI exposure index 2025 (Working Paper 140)
    how: browser
    url: https://www.ilo.org/publications/generative-ai-and-jobs-refined-global-index-occupational-exposure
    instructions: >
      No machine-readable file was found. Download the WP140 PDF and extract Annex Table A1
      (ISCO-08 4-digit: mean score, SD, exposure gradient 1-4 / minimal / not exposed) into
      data/curated/ilo_exposure.csv. A human spot-checks every row used and fills verified_by.
    path: data/raw/ilo/
    coverage: International (ISCO-08)
    licence: ILO publication terms, cite Gmyrek et al. 2025  # (verify)
    licence_checked_by: ""
    used_by: [disruption risk, M2 calibration]

  - id: oid_2025
    name: Skills England / DfE Occupations in Demand 2025 (plus 2024 original and revised)
    how: browser
    url: https://explore-education-statistics.service.gov.uk/find-statistics/occupations-in-demand/2025/data-guidance
    instructions: >
      Use "Download all data (ZIP)". The supporting file "Occupations by demand" (CSV) has
      demand level, demand index, worker numbers, uncertainty and imputation flags per
      4-digit SOC 2020. Data guidance says the index covers the UK labour market (ASHE-based
      indicators are GB only); the spec labelled it England, so check and label correctly.
      Symbols: z = not applicable, x = unavailable, c = suppressed. Keep 2024 original for
      the track-record check.
    path: data/raw/oid/
    coverage: UK (some indicators GB)
    licence: Open Government Licence v3.0  # (verify)
    licence_checked_by: ""
    used_by: [shortage flag, market risk]

  - id: adzuna
    name: Adzuna jobs API (live ad counts, advertised pay, history)
    how: script
    script: scripts/fetch/adzuna_snapshot.py
    url: https://developer.adzuna.com/
    instructions: >
      Free app id and key, run from a laptop only (not needed on the cluster). Keys in .env.
      The script writes a dated snapshot to snapshots/adzuna/ for the demo fallback.
    path: snapshots/adzuna/
    coverage: UK
    licence: Adzuna API terms, show "Jobs by Adzuna"
    licence_checked_by: ""
    used_by: [ads_now, nowcast, pull-the-plug demo]

  - id: ashe_2007_2010
    name: ONS ASHE Table 14, 2007 to 2010 (SOC 2000 coding), earlier editions of ashe_t14
    how: browser
    url: https://www.ons.gov.uk/employmentandlabourmarket/peopleinwork/earningsandworkinghours/datasets/occupation4digitsoc2010ashetable14   # (verify) 2007-2010 editions are SOC 2000 coded; may be a different ONS page
    instructions: >
      The same ONS page as ashe_t14 holds the 2007 to 2010 editions (SOC 2000 codes). Keep only
      Table 14.7a (annual gross pay) and 14.7b (sampling error, CV). Employees only. Bridged to
      SOC 2020 in two steps via soc2000_soc2010 and soc2010_soc2020.
    path: data/raw/ashe_2007_2010/
    coverage: UK, employees only
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [R expected return (real pay path), M4 demand trend, M5 track record, M7 crisis resilience]

  - id: soc2000_soc2010
    name: ONS relationship tables SOC 2000 and SOC 2010
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      Built from people coded to both systems (LFS Jan to Mar 2007, Census 2001 where the LFS
      base is empty). ONS lists only destinations above a threshold, so weights are renormalised.
      Second step of the 2007 to 2010 bridge (SOC 2000 -> SOC 2010 -> SOC 2020).
    path: data/raw/crosswalks_soc2000/
    coverage: UK
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [R expected return (real pay path), M5 track record, M7 crisis resilience]

  - id: cpih
    name: ONS CPIH index (series L522, 2015 = 100, dataset MM23)
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      Series L522, 2015 = 100, 1988 to 2026. Used to turn nominal pay into real pay in 2025
      prices. ASHE annual pay is for the tax year ending 5 April, so use the tax-year average of
      the index, not the April value (Arsenii's review finding, v1.2).
    path: data/raw/cpih/
    coverage: UK, 1988 to 2026
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [R expected return (real pay path)]

  - id: soc2020_coding_index
    name: ONS SOC 2020 Volume 2 coding index (version of 27 Aug 2026)
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      About 32,000 UK job titles, each with a SOC 2020 code and an ISCO-08 code. This is how a
      SOC 2020 -> ISCO-08 map with shares is built (crosswalk_build.py), so ISCO-08 sources such
      as ILO exposure can be joined. Job titles also feed the links to ESCO occupations.
    path: data/raw/soc2020_index/
    coverage: UK
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [M2 automation exposure (ISCO join), M3 hedge careers (ESCO links)]

  - id: dfe_ai_annex
    name: DfE "The impact of AI on UK jobs and training", Annex 1 (2023)
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      Annex 1 gives exposure for 365 SOC 2010 occupations. Used as a percentile rank to
      cross-check the ILO exposure score, never as the headline number.
    path: data/raw/dfe_ai_annex/
    coverage: UK, 2023, SOC 2010 (365 occupations)
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [M2 automation exposure (cross-check)]

  - id: ons_job_adverts
    name: "ONS online job advert estimates (source: Adzuna), 28 categories, weekly"
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      Weekly estimates for 28 job-advert categories, 2018 to 2024, republished by ONS from
      Adzuna. The series was discontinued in Oct 2024. Category level only, never occupation
      level. Used for the tech-slump crisis window.
    path: data/raw/ons_job_adverts/
    coverage: UK, 28 categories, weekly, 2018 to 2024
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [M7 crisis resilience (tech slump)]

  - id: aps_2016_age_bands
    name: ONS APS 2016 age bands by 4-digit occupation (ad hoc request 006998)
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      ONS ad hoc request 006998. UK, 2016, includes self-employed, SOC 2010 codes, small cells
      suppressed. Gives young_worker_share (people aged 16 to 24 in the job).
    path: data/raw/aps_2016_age_bands/
    coverage: UK, 2016, includes self-employed, SOC 2010
    licence: Open Government Licence v3.0
    licence_checked_by: ""
    used_by: [R expected return (young_worker_share)]

  - id: onet
    name: O*NET 31.0 related occupations and the ESCO to O*NET-SOC crosswalk
    how: browser
    url: ""   # (verify) Arsenii's SOURCE.md has no URL
    instructions: >
      US Department of Labor. Reference check of hedge careers only; never a training signal
      and never shown to users as a UK number.
    path: data/raw/onet/
    coverage: US occupations
    licence: CC BY 4.0
    licence_checked_by: ""
    used_by: [M3 hedge careers (reference check)]

  - id: routes_curated
    name: Routes into each demo career by nation (degree, graduate apprenticeship, apprenticeship, college)
    how: manual
    instructions: >
      A person copies each route from its real page into data/curated/routes.csv, with the
      page URL in `url`, the site name in `source` and their initials in `verified_by`.
      Scotland first (apprenticeships.scot, Graduate Apprenticeships, university course
      pages); England from Find an Apprenticeship if time. Never write a route from memory.
    path: data/curated/routes.csv
    coverage: Scotland first; England if time
    licence: (verify) per source page
    licence_checked_by: ""
    used_by: [roadmap routes]
